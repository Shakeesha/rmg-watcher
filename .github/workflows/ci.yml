name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIPELINE_MOCK_MODE: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Tests and static analysis
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what stock Raspberry Pi OS Bookworm ships.
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit and integration tests (pytest)
        run: python -m pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type and component checks (svelte-check, tsc)
        run: npm run check

      - name: Build production bundle
        run: npm run build

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]" pip-audit

      - name: Audit Python dependencies (pip-audit)
        run: python -m pip_audit . --skip-editable --desc off

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Node dependencies (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

  static-checks:
    name: Configuration and deployment file checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate shell scripts
        run: bash -n deploy/scripts/*.sh

      - name: Validate configuration files
        run: |
          python -m pip install pyyaml --quiet
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          import yaml

          with open("pyproject.toml", "rb") as handle:
              tomllib.load(handle)
          yaml.safe_load(Path(".github/workflows/ci.yml").read_text(encoding="utf-8"))
          yaml.safe_load(Path("deploy/docker-compose.rpi5.yml").read_text(encoding="utf-8"))
          for path in Path("data").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("configuration files are valid")
          PY

      - name: Verify required deployment files
        run: |
          for path in \
            .env.example \
            deploy/Dockerfile \
            deploy/docker-compose.rpi5.yml \
            deploy/scripts/install-rpi5.sh \
            deploy/scripts/start-kiosk.sh \
            deploy/systemd/rmg-watcher-api.service \
            deploy/systemd/rmg-watcher-pipeline.service \
            deploy/systemd/rmg-watcher-pipeline.timer \
            deploy/systemd/rmg-watcher-kiosk.service \
            docs/architecture.md \
            docs/hardware_ui.md \
            docs/schema.md; do
            test -f "$path" || { echo "Missing: $path"; exit 1; }
          done

      - name: Check whitespace
        run: git diff --check

  # ---------------------------------------------------------------------------
  # Package and deployment rehearsal
  # ---------------------------------------------------------------------------
  package-rpi5:
    name: Package for Raspberry Pi 5
    runs-on: ubuntu-latest
    needs: [backend, frontend, security, static-checks]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend and stop catalog
        working-directory: frontend
        run: |
          npm run build
          npm run build:stops

      - name: Verify generated stop catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = Path("data/german-stops.json")
          if not catalog.is_file():
              raise SystemExit("npm run build:stops did not create data/german-stops.json")
          stops = json.loads(catalog.read_text(encoding="utf-8"))
          if not isinstance(stops, list) or not stops:
              raise SystemExit("data/german-stops.json must be a non-empty JSON array")
          print(f"stop catalog contains {len(stops)} stops")
          PY

      - name: Create Raspberry Pi release archive
        run: |
          tar -czf rmg-watcher-rpi5.tar.gz \
            src \
            sql \
            deploy \
            docs \
            frontend/dist \
            frontend/package.json \
            frontend/package-lock.json \
            tests/fixtures \
            data/german-stops.json \
            pyproject.toml \
            README.md \
            CHANGELOG.md \
            .env.example

      - name: Upload Raspberry Pi artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmg-watcher-rpi5
          path: rmg-watcher-rpi5.tar.gz
          if-no-files-found: error

  deploy-smoke:
    name: Deploy archive smoke test
    runs-on: ubuntu-latest
    needs: [package-rpi5]
    timeout-minutes: 15
    steps:
      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@v4
        with:
          name: rmg-watcher-rpi5

      - name: Extract release archive
        run: |
          mkdir -p /tmp/rmg-smoke
          tar -xzf rmg-watcher-rpi5.tar.gz -C /tmp/rmg-smoke
          test -f /tmp/rmg-smoke/frontend/dist/index.html
          test -f /tmp/rmg-smoke/data/german-stops.json
          test -f /tmp/rmg-smoke/docs/hardware_ui.md
          test -x /tmp/rmg-smoke/deploy/scripts/install-rpi5.sh
          bash -n /tmp/rmg-smoke/deploy/scripts/*.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from the extracted archive
        working-directory: /tmp/rmg-smoke
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
          .venv/bin/rmg-watcher --help

      - name: Start the packaged API and probe it
        working-directory: /tmp/rmg-smoke
        env:
          PIPELINE_MOCK_MODE: "true"
          API_PORT: "8011"
        run: |
          .venv/bin/rmg-watcher serve > /tmp/rmg-smoke/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8011/api/health > /tmp/rmg-smoke/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/rmg-smoke/health.json
          curl -fsS http://127.0.0.1:8011/ -o /tmp/rmg-smoke/index.html
          grep -q '<div id="app">' /tmp/rmg-smoke/index.html
          grep -q '"status":"ok"' /tmp/rmg-smoke/health.json

  docker-build:
    name: Container build and Compose validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f deploy/Dockerfile -t rmg-watcher:ci .

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose -f deploy/docker-compose.rpi5.yml config --quiet

  # ---------------------------------------------------------------------------
  # Deployment gate
  # ---------------------------------------------------------------------------
  deployment-gate:
    name: Pre-deployment gate
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - security
      - static-checks
      - package-rpi5
      - deploy-smoke
      - docker-build
    if: always()
    steps:
      - name: Verify every check passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "Deployment blocked: $result"
              exit 1
            fi
          done

  release:
    name: Attach release archive
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [deployment-gate]
    permissions:
      contents: write
    steps:
      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@v4
        with:
          name: rmg-watcher-rpi5

      - name: Attach archive to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: rmg-watcher-rpi5.tar.gz
