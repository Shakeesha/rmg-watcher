name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIPELINE_MOCK_MODE: "true"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types and Svelte components
        run: npm run check

      - name: Build production bundle
        run: npm run build

  package-rpi5:
    name: Package for Raspberry Pi 5
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build
          npm run build:stops

      - name: Create Raspberry Pi release archive
        run: |
          tar -czf rmg-watcher-rpi5.tar.gz \
            src \
            sql \
            deploy \
            frontend/dist \
            data/german-stops.json \
            pyproject.toml \
            README.md \
            CHANGELOG.md \
            .env.example

      - name: Upload Raspberry Pi artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmg-watcher-rpi5
          path: rmg-watcher-rpi5.tar.gz
          if-no-files-found: error

  release:
    name: Attach release archive
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package-rpi5
    permissions:
      contents: write
    steps:
      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@v4
        with:
          name: rmg-watcher-rpi5

      - name: Attach archive to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: rmg-watcher-rpi5.tar.gz
