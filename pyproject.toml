[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rmg-watcher"
dynamic = ["version"]
description = "RMV/HEAG/DB transit delay telemetry device for Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
rmg-watcher = "rmg_watcher.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/rmg_watcher/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rmg_watcher"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
